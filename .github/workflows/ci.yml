name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Repository & Budget Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unittests
        run: python -m unittest discover -s tests -v
