<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Passive Privacy Visor front layout</title>
  <desc id="desc">Diagram of a curved mesh visor with an open eye corridor, angled tulle zones, black foam facets and reflective tabs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b16"/>
      <stop offset="1" stop-color="#171027"/>
    </linearGradient>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 0H12M0 0V12" stroke="#586378" stroke-width="1" opacity=".75"/>
    </pattern>
    <pattern id="tulle" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M0 0H14M0 0V14" stroke="#d93cff" stroke-width="1.3" opacity=".55"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="visorClip">
      <path d="M300 180 Q600 80 900 180 L850 535 Q600 625 350 535 Z"/>
    </clipPath>
    <mask id="carrierMask">
      <rect width="1200" height="720" fill="black"/>
      <path d="M315 190 Q600 100 885 190 L837 520 Q600 600 363 520 Z" fill="white"/>
      <rect x="430" y="250" width="340" height="105" rx="45" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f5f6ff" font-family="system-ui,sans-serif" font-size="36" font-weight="700">PASSIVE PRIVACY VISOR // V1</text>
  <text x="72" y="116" fill="#9aa5bd" font-family="system-ui,sans-serif" font-size="18">front view · conceptual, not to scale</text>

  <path d="M300 180 Q600 80 900 180 L850 535 Q600 625 350 535 Z" fill="#111724" stroke="#c8d1e6" stroke-width="8"/>
  <rect x="260" y="120" width="680" height="520" fill="url(#mesh)" clip-path="url(#visorClip)"/>
  <rect width="1200" height="720" fill="url(#tulle)" mask="url(#carrierMask)"/>

  <rect x="430" y="250" width="340" height="105" rx="45" fill="#08d9ff" fill-opacity=".13" stroke="#20e8ff" stroke-width="4" stroke-dasharray="12 8" filter="url(#glow)"/>
  <text x="600" y="312" text-anchor="middle" fill="#b9f8ff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">CLEAR EYE CORRIDOR</text>
  <text x="600" y="337" text-anchor="middle" fill="#9ddbe2" font-family="system-ui,sans-serif" font-size="15">original steel mesh only</text>

  <g fill="#11131d" stroke="#ff3df2" stroke-width="4">
    <path d="M385 208 L535 177 L520 234 L400 247 Z"/>
    <path d="M665 177 L815 208 L800 247 L680 234 Z"/>
    <path d="M380 370 L500 360 L482 470 L395 495 L360 430 Z"/>
    <path d="M700 360 L820 370 L840 430 L805 495 L718 470 Z"/>
    <path d="M525 500 L675 500 L700 550 L600 582 L500 550 Z"/>
  </g>

  <g fill="#f3ff67" stroke="#fff9b0" stroke-width="2" filter="url(#glow)">
    <rect x="412" y="401" width="26" height="62" rx="5" transform="rotate(18 425 432)"/>
    <rect x="762" y="401" width="26" height="62" rx="5" transform="rotate(-18 775 432)"/>
    <rect x="568" y="522" width="64" height="22" rx="5"/>
  </g>

  <g font-family="system-ui,sans-serif" font-size="18">
    <path d="M315 232 L160 190" stroke="#d93cff" stroke-width="3"/>
    <circle cx="315" cy="232" r="5" fill="#d93cff"/>
    <text x="70" y="177" fill="#f3c4ff" font-weight="700">ANGLED TULLE</text>
    <text x="70" y="201" fill="#aeb6c8">outside sightline</text>

    <path d="M802 215 L1020 170" stroke="#ff3df2" stroke-width="3"/>
    <circle cx="802" cy="215" r="5" fill="#ff3df2"/>
    <text x="1025" y="164" fill="#ffc5fb" font-weight="700">FOAM FACETS</text>
    <text x="1025" y="188" fill="#aeb6c8">soft + matte</text>

    <path d="M788 435 L1010 455" stroke="#f3ff67" stroke-width="3"/>
    <circle cx="788" cy="435" r="5" fill="#f3ff67"/>
    <text x="1015" y="449" fill="#f7ffab" font-weight="700">REFLECTIVE TABS</text>
    <text x="1015" y="473" fill="#aeb6c8">camera-facing only</text>
  </g>

  <rect x="245" y="646" width="710" height="44" rx="22" fill="#221a34" stroke="#4c3a66"/>
  <text x="600" y="674" text-anchor="middle" fill="#e6dff3" font-family="system-ui,sans-serif" font-size="17">NO IR · NO LASERS · NO LEDs · NO ADDED MATERIAL ACROSS EYES</text>
</svg>
